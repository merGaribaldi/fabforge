<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fabforge — Пульт мировой истории</title>
    
    <!-- Фирменная золотая иконка Fabforge (фавиконка) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d0d0f'/><text x='50% ' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='Montserrat, sans-serif' font-weight='700' font-size='60' fill='%23d4af37'>F</text></svg>">

    <!-- Подключаем вариативный Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body onload="initClock()">

    <!-- Главный титульник (экран приветствия) -->
    <div id="hero-screen" class="hero">
        
        <!-- Верхняя плашка на титульнике -->
        <header class="top-bar">
            <div class="logo-area">
                <span class="brand">FABFORGE</span>
                <span class="divider">—</span>
                <span class="subtitle">Пульт мировой истории</span>
            </div>

            <!-- Живой статус и часы -->
            <div class="terminal-status">
                <span class="pulse-dot"></span>
                <span class="status-text">СИСТЕМА АКТИВНА</span>
                <span class="clock" id="clock-hero">00:00:00</span>
            </div>
            
            <!-- Угловое минималистичное меню с точками -->
            <div class="corner-menu">
                <button class="menu-toggle-btn" onclick="toggleMenu()">
                    •••
                </button>
                <div id="dropdown-menu" class="dropdown-content" style="display: none;">
                    <button onclick="alert('Раздел инструкций в разработке, бро!')">Инструкция</button>
                    <button onclick="alert('Спасибо за поддержка! Скоро подключим донаты 🤗')">Донаты</button>
                </div>
            </div>
        </header>

        <div class="hero-content">
            <h1>FABFORGE</h1>
            <p class="slogan">Место, где рождается история</p>
            
            <!-- Главная кнопка входа -->
            <button class="btn-main" onclick="openApp()">
                Открыть карту мира
            </button>
        </div>
    </div>

    <!-- Основной интерфейс пульта (пока спрятан) -->
    <div id="app-screen" class="app-container" style="display: none;">
        <!-- Верхняя плашка терминала в карте -->
        <header class="top-bar">
            <div class="logo-area">
                <span class="brand">FABFORGE</span>
                <span class="divider">—</span>
                <span class="subtitle">Пульт мировой истории</span>
            </div>

            <!-- Живой статус и часы в карте -->
            <div class="terminal-status">
                <span class="pulse-dot"></span>
                <span class="status-text">СИСТЕМА АКТИВНА</span>
                <span class="clock" id="clock-app">00:00:00</span>
            </div>

            <button class="back-btn" onclick="returnToHero()">← На главную</button>
        </header>

        <div class="workspace">
            <div class="map-panel">
                <p>Здесь будет интерактивная карта мира 2025 года 🗺️</p>
            </div>
            <div class="data-panel">
                <p>Здесь будут показатели стран, экономика и армия 📊</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
